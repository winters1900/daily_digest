date_policy: 首次公开、录用、正式发表、采集时间分别保存；没有精确日期时保留未知，不从会议年份或采集时间推断。近期录用旧论文标记为录用动态。
deduplication: 先按 DOI、arXiv ID 或 OpenReview ID 合并，再核对标题与作者；与 X 博主解读关联为同一主题，保留原论文和解读链接。
card_fields:
- 解决什么问题
- 核心方法与新贡献
- 主要结果及实验条件
- 局限与适用范围
- 工程应用或复现动作
- 会刊及录用状态
- 时间与原文链接
- 阅读深度：摘要/正文/复现
access_policy: 优先官方开放论文与作者公开版本；不额外购买数据库或摘要 API。只有摘要可读时不得声称全文精读。
