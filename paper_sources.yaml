selection:
  daily_target_items: 10
  discovery_candidate_target: 30
  weekly_deep_reads: 1
  window_months: 2
  allow_empty: true
  venue_ranking_note: priority 表示对当前主题的采集优先级，不代表统一学术等级或官方排名
  required:
  - 主题相关
  - 原文可追溯
  - 研究贡献与证据可解释
  prefer:
  - 明确的实验设置和比较基线
  - 消融实验与局限性
  - 代码、数据或复现说明
  - 官方奖项或 Oral/Spotlight 信息
  avoid:
  - 仅凭引用数或社交热度排序
  - 仅凭作者机构决定质量
  - 把近期录用的旧预印本当成新研究
  - 用旧论文凑每日数量
  preprint_policy: 预印本可单列前沿观察，不占顶会顶刊精选配额；必须明确尚未核验录用，不凭作者自述标记正式接受
  track_policy: 主会、Findings、Workshop、Demo 分开标记；Oral/Spotlight/奖项需官方证据，且不作为唯一质量标准
  section_targets:
    peer_reviewed: 5
    arxiv: 3
    recommended: 2
  review_limit: 50
  minimum_score: 65
  max_per_topic: 3
  minimum_topics: 4
